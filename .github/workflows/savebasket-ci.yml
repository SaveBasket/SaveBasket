name: SaveBasket CI

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'index.html'
      - 'owner.html'
      - 'package.json'
      - '.github/workflows/savebasket-ci.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'index.html'
      - 'owner.html'
      - 'package.json'
      - '.github/workflows/savebasket-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
