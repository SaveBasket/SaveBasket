name: Luxe Studio build

on:
  push:
    branches: [luxe-studio-foundation, luxe-studio-production]
    paths:
      - 'luxe-studio/**'
      - '.github/workflows/luxe-studio-build.yml'
  pull_request:
    paths:
      - 'luxe-studio/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: luxe-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: luxe-studio/package.json
      - run: npm install
      - run: npm run build
      - run: node --check api/create-checkout.js
      - run: node --check api/stripe-webhook.js
